# nginx HTTP/2 over TLS for the h2-interop rows (Tools~/h2-interop/run.sh mounts the per-run dir on /pki).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /pki/leaf-valid.pem;
        ssl_certificate_key /pki/leaf.key;
        root /pki/www;
        client_max_body_size 4m;
        location = /upload {
            return 200 "uploaded\n";
        }
        location = /headers {
            include /etc/nginx/h2-headers.conf;
            return 200 "headers\n";
        }
    }
}
