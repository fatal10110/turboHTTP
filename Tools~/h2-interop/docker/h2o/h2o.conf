# h2o HTTP/2 over TLS for the h2-interop rows (Tools~/h2-interop/run.sh mounts the per-run dir on /pki).
listen:
  port: 8443
  ssl:
    certificate-file: /pki/leaf-valid.pem
    key-file: /pki/leaf.key
user: root
error-log: /dev/stderr
hosts:
  default:
    paths:
      /upload:
        # Echoes the request body, like nghttpd --echo-upload.
        mruby.handler: |
          Proc.new do |env|
            [200, {"content-type" => "application/octet-stream"}, [env["rack.input"].read]]
          end
      /headers:
        # x-h-<i> = 200 x chr('a' + i % 26) (InteropRows.ResponseHeaderValue).
        mruby.handler: |
          Proc.new do |env|
            headers = {}
            40.times { |i| headers["x-h-#{i}"] = (97 + i % 26).chr * 200 }
            [200, headers, ["headers\n"]]
          end
      /:
        file.dir: /pki/www
