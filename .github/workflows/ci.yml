name: CI

on:
  # Branch pushes are covered by pull_request (the ruleset requires a PR that is
  # up to date with main); main pushes still run to keep caches warm.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Repo invariants (.meta, asmdef graph, JSON), whitespace format, shadow build of every
  # asmdef for the Editor/iOS/Android define sets with analyzers + banned APIs (ratchet
  # baseline), actionlint, shellcheck and the Python tool tests. Same as Tools~/ci/check.sh --full.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Unity version
        id: unity
        run: echo "version=$(cat 'Tools~/ci/unity-version')" >> "$GITHUB_OUTPUT"

      # 34 MB of managed DLLs plus Unity's NUnit and Test Framework package tarballs (1 MB, for the
      # Tests/ shadow build, #297) extracted from the ~4 GB unityci/editor image; the image is only
      # pulled when the cache misses (new Unity version). Its own key: the interop jobs cache the
      # DLLs without the packages (shadow_build.py --no-tests).
      - name: Cache Unity managed DLLs and test packages
        uses: actions/cache@v6
        with:
          path: .tools/unity-managed
          key: unity-managed-tests-${{ steps.unity.outputs.version }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Tools~/ci/Shadow.props') }}

      - name: Install actionlint and ripgrep
        run: |
          sudo apt-get install -y --no-install-recommends ripgrep
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check
        run: '"Tools~/ci/check.sh" --full'

  # TLS interop (#230, #113): the production TLS providers (BouncyCastle, SslStream, Auto) over the
  # shadow-built DLLs against OpenSSL 3 s_server: handshakes pinned to 0xC030 / 0x1302 through
  # BouncyCastleTlsStream, and the negative certificate suite with positive controls. Unity is not
  # needed; a missing openssl or BouncyCastle provider fails the job (Tools~/tls-interop/run.sh).
  tls-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Unity version
        id: unity
        run: echo "version=$(cat 'Tools~/ci/unity-version')" >> "$GITHUB_OUTPUT"

      - name: Cache Unity managed DLLs
        uses: actions/cache@v6
        with:
          path: .tools/unity-managed
          key: unity-managed-${{ steps.unity.outputs.version }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Tools~/ci/Shadow.props') }}

      - name: TLS interop rows
        run: '"Tools~/tls-interop/run.sh"'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tls-interop-logs
          path: .build/tls-interop/run

  # HTTP/2 adversarial server and interop (#111): the scripted adversarial-server scenarios
  # (Tests/Runtime/Transport/Http2/Adversarial, compiled into a plain .NET harness against the
  # shadow-built DLLs) and the production RawSocketTransport over TLS + ALPN h2 against Kestrel,
  # nghttpd and nginx (docker, pinned images). Unity is not needed (Tools~/h2-interop/run.sh).
  h2-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Unity version
        id: unity
        run: echo "version=$(cat 'Tools~/ci/unity-version')" >> "$GITHUB_OUTPUT"

      - name: Cache Unity managed DLLs
        uses: actions/cache@v6
        with:
          path: .tools/unity-managed
          key: unity-managed-${{ steps.unity.outputs.version }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Tools~/ci/Shadow.props') }}

      - name: HTTP/2 adversarial and interop rows
        run: '"Tools~/h2-interop/run.sh"'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: h2-interop-logs
          path: .build/h2-interop/run

  # The ruleset requires this single check; it passes only when every job above does.
  # CI never runs Unity (no license, #188): the Unity gates are the host-editor runs in
  # Development~/docs/agents/testing.md ("Host-editor gates"), not a job here.
  ci:
    if: always()
    needs: [lint, tls-interop, h2-interop]
    runs-on: ubuntu-latest
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          TLS_INTEROP: ${{ needs.tls-interop.result }}
          H2_INTEROP: ${{ needs.h2-interop.result }}
        run: '[ "$LINT" = success ] && [ "$TLS_INTEROP" = success ] && [ "$H2_INTEROP" = success ]'
